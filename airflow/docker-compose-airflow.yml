version: '3'
services:
  airflow:
    image: apache/airflow:2.10.2
    container_name: airflow
    user: "0:0"  # Chạy với root để có quyền Docker
    restart: always
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=FB0o_zt4e3Zkkge3YzTYFz8ON5G6KFzpR1k9l53Pr8c=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__RBAC=True
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
      - /home/annez02/BigData_nhom10:/home/annez02/BigData_nhom10:ro
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy 
    networks:
      - bigdata_net
    command: >
      bash -c "
      echo 'Setting up Docker permissions...' &&
      chmod 666 /var/run/docker.sock || true &&
      echo 'Installing Python packages...' &&
      python3 -m pip install --break-system-packages hdfs kafka-python || pip install hdfs kafka-python &&
      echo 'Installing packages for airflow user...' &&
      su -s /bin/bash airflow -c 'pip install --user hdfs kafka-python' || true &&
      echo 'Waiting for Postgres...' &&
      sleep 10 &&
      echo 'Initializing database...' &&
      su -s /bin/bash airflow -c 'airflow db init' || su -s /bin/bash airflow -c 'airflow db upgrade' &&
      echo 'Creating admin user...' &&
      su -s /bin/bash airflow -c 'airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com' || true &&
      echo 'Starting Airflow services...' &&
      su -s /bin/bash airflow -c 'airflow scheduler & airflow webserver'"

  postgres:
    image: postgres:13
    container_name: airflow-postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    # FIX 3: Thêm Healthcheck để đảm bảo DB đã sẵn sàng nhận kết nối
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bigdata_net

networks:
  bigdata_net:
    external: true